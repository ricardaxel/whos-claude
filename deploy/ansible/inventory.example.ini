# Copie ce fichier en inventory.ini (non versionné) et adapte-le.
[whosclaude]
jeu.exemple.fr ansible_user=debian

[whosclaude:vars]
site_address=jeu.exemple.fr
# Dépôt privé cloné en SSH : la clé de ton poste est transmise au serveur (agent SSH),
# rien n'est copié dessus. Pour un dépôt public, repo_url=https://github.com/... suffit.
ansible_ssh_common_args=-o ForwardAgent=yes
