# Déploiement : docker compose up -d --build   (voir README, section « Déployer »)

# Journaux tournants : sans ça, ils grossissent sans limite sur le disque du serveur.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  game:
    build:
      context: .
      target: game
    restart: unless-stopped
    environment:
      PORT: "2567"
    # Pas de port publié : seul Caddy parle au serveur de jeu, sur le réseau interne.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(2567, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    # Plafond mémoire : un abus ne peut pas faire tomber toute la machine.
    mem_limit: 512m
    logging: *logging

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    # HTTP simple, publié sur la machine seulement : ton reverse proxy (domaine, HTTPS) le
    # fait suivre avec « reverse_proxy 127.0.0.1:8080 ». BIND_ADDRESS=0.0.0.0 pour l'ouvrir
    # au réseau (essai sur le wifi de la maison, ou proxy sur une autre machine).
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    mem_limit: 128m
    logging: *logging
