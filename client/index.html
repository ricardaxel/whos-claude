<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WhosClaude</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
      #game { width: 100%; height: 100%; touch-action: none; }

      /* Contrôles tactiles : affichés seulement sur écran tactile. */
      #touch-controls { display: none; }
      @media (pointer: coarse) {
        #touch-controls { display: block; }
      }
      .touch-btn {
        position: fixed; z-index: 10;
        border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 50%;
        background: rgba(0, 0, 0, 0.35); color: #fff; font-weight: bold; font-size: 15px;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .touch-btn:active { background: rgba(255, 255, 255, 0.3); }
      #touch-advance { left: 16px; bottom: 16px; width: 96px; height: 96px; }
      #touch-reveal { left: 124px; bottom: 16px; width: 56px; height: 56px; font-size: 12px; }
      #touch-fire { right: 16px; bottom: 16px; width: 96px; height: 96px; border-color: #ff5a5a; }
      #touch-start {
        left: 50%; top: 12px; transform: translateX(-50%);
        border-radius: 24px; padding: 10px 22px; display: none;
      }
      body[data-phase="lobby"] #touch-start { display: block; }
      #rotate-hint {
        display: none; position: fixed; top: 72px; left: 0; right: 0;
        text-align: center; color: #bbb; font-size: 14px;
      }
      @media (pointer: coarse) and (orientation: portrait) {
        #rotate-hint { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">Tourne ton téléphone en paysage pour mieux voir</div>
    <div id="touch-controls">
      <button id="touch-start" class="touch-btn">Lancer</button>
      <button id="touch-advance" class="touch-btn">Avancer</button>
      <button id="touch-reveal" class="touch-btn">Moi ?</button>
      <button id="touch-fire" class="touch-btn">Tirer</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
